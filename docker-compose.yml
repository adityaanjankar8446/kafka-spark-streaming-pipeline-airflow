x-airflow-common: &airflow-common
  image: apache/airflow:2.9.0
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./data:/opt/data
    - ./checkpoints:/opt/checkpoints
    - ./pipelines:/opt/pipelines
    - ./jars:/opt/jars
    # FIX: Mount requirements.txt so pip install works reliably
    - ./requirements.txt:/opt/airflow/requirements.txt
  depends_on:
    postgres:
      condition: service_healthy
    broker:
      condition: service_healthy
  networks:
    - sdp-net


services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: sdp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2185:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sdp-net

  broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sdp-broker
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "29095:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,PLAINTEXT_HOST://localhost:29095
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - sdp-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sdp-kafka-ui
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8087:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:9092
    networks:
      - sdp-net

  spark-master:
    image: apache/spark:3.5.1
    container_name: sdp-spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    environment:
      - SPARK_MASTER_HOST=sdp-spark-master
    ports:
      - "9090:8080"
      - "7078:7077"
    volumes:
      - ./scripts:/opt/scripts
      - ./data:/opt/data
      - ./checkpoints:/opt/checkpoints
    networks:
      - sdp-net

  spark-worker:
    image: apache/spark:3.5.1
    container_name: sdp-spark-worker
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://sdp-spark-master:7077
    environment:
      - SPARK_WORKER_MEMORY=4g
      - SPARK_WORKER_CORES=4
    depends_on:
      - spark-master
    volumes:
      - ./scripts:/opt/scripts
      - ./data:/opt/data
      - ./checkpoints:/opt/checkpoints
    networks:
      - sdp-net

  spark-worker-2:
    image: apache/spark:3.5.1
    container_name: sdp-spark-worker-2
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://sdp-spark-master:7077
    environment:
      - SPARK_WORKER_MEMORY=4g
      - SPARK_WORKER_CORES=4
    depends_on:
      - spark-master
    volumes:
      - ./pipelines:/opt/pipelines
      - ./data:/opt/data
      - ./checkpoints:/opt/checkpoints
      - ./jars:/opt/jars
    networks:
      - sdp-net

