  # ── Airflow ─────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:13
    container_name: postgres_new
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5435:5432"
    volumes:
      - postgres-airflow:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sdp-net

  airflow-init:
    image: apache/airflow:2.9.0
    container_name: airflow-init_new
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    volumes:
      - ./dags:/opt/airflow/dags
      - ./requirements.txt:/opt/airflow/requirements.txt
    command: >
      bash -c "
        pip install -r /opt/airflow/requirements.txt &&
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@example.com"
    
    networks:
      - sdp-net

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler_new
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./pipelines:/opt/pipelines
      - ./scripts:/opt/scripts
      - ./data:/opt/data
      - ./checkpoints:/opt/checkpoints
      - ./requirements.txt:/opt/airflow/requirements.txt
    # FIX: pip install BEFORE starting schedul  er
    command: bash -c "pip install -r /opt/airflow/requirements.txt && airflow scheduler"
    networks:
      - sdp-net

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver_new
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
    ports:
      - "8082:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./pipelines:/opt/pipelines
      - ./scripts:/opt/scripts
      - ./data:/opt/data
      - ./checkpoints:/opt/checkpoints
      - ./requirements.txt:/opt/airflow/requirements.txt
    # FIX: pip install BEFORE starting webserver
    command: bash -c "pip install -r /opt/airflow/requirements.txt && airflow webserver"
    networks:
      - sdp-net


volumes:
  postgres-airflow:

networks:
  sdp-net:
    driver: bridge